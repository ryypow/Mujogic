# Example configuration file
# Usage: python scripts/training/train.py --config configs/example_config.yaml

model:
  name: "ExampleCNN"
  num_classes: 10
  input_channels: 3
  pretrained: false

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.001
  optimizer: "adam"  # adam, sgd, adamw
  weight_decay: 0.0001

  # Learning rate scheduling
  scheduler:
    type: "ReduceLROnPlateau"  # ReduceLROnPlateau, StepLR, CosineAnnealingLR
    patience: 3
    factor: 0.5
    min_lr: 0.000001

data:
  train_path: "data/processed/train"
  val_path: "data/processed/val"
  test_path: "data/processed/test"
  img_size: 224
  num_workers: 4

  # Data augmentation (training only)
  augmentation:
    horizontal_flip: true
    rotation: 15
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2

output:
  model_dir: "models/example_cnn"
  results_dir: "results/example_cnn"
  save_best_only: true
  save_frequency: 5  # Save checkpoint every N epochs

logging:
  tensorboard: true
  tensorboard_dir: "results/example_cnn/tensorboard"
  print_frequency: 10  # Print every N batches

# Random seed for reproducibility
seed: 42

# Device
device: "cuda"  # cuda, cpu, or specific GPU like cuda:0
